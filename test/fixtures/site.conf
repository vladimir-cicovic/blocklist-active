# Test "site" for the SITE_URL check (nginx:alpine container bl-site).
#   /     200
#   /r    302 -> /     (a redirecting site; must pass)
#   /500  500          (must trigger a restore of the previous lists)
server {
    listen 80 default_server;
    location = /    { return 200 "ok\n"; }
    location = /r   { return 302 /; }
    location = /500 { return 500; }
}
