# Copy to inventory.ini (not tracked by git) and adjust.
[blocklist]
web1.example.com   ansible_user=root
web2.example.com   ansible_user=admin   ; a user with passwordless sudo

[blocklist:vars]
blocklist_site_url=https://www.example.com/
# lists are written as JSON so that Ansible does not guess the type
blocklist_owner_ips=["203.0.113.10"]
blocklist_countries=["ir","ru","cn","br","co","bg","ro","sc"]
blocklist_whitelist_cc=["ba"]
